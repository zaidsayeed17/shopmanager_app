<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#e2dfff", "surface-bright": "#faf8ff", "secondary-container": "#99efe5", "on-error": "#ffffff", "primary-fixed": "#bde9ff", "outline": "#70787d", "inverse-surface": "#283044", "on-tertiary": "#ffffff", "surface-container-low": "#f2f3ff", "on-secondary-container": "#006f67", "surface-container": "#eaedff", "error-container": "#ffdad6", "on-secondary-fixed-variant": "#00504a", "outline-variant": "#bfc8cd", "secondary": "#006a63", "surface-container-high": "#e2e7ff", "surface-tint": "#1e667f", "surface-variant": "#dae2fd", "tertiary-container": "#4a45b6", "on-surface": "#131b2e", "primary": "#004357", "on-secondary": "#ffffff", "inverse-on-surface": "#eef0ff", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#3b35a7", "surface-container-lowest": "#ffffff", "inverse-primary": "#90cfec", "on-primary-fixed": "#001f2a", "on-surface-variant": "#40484c", "tertiary": "#322a9e", "primary-fixed-dim": "#90cfec", "on-tertiary-fixed": "#0f0069", "on-background": "#131b2e", "surface": "#faf8ff", "surface-dim": "#d2d9f4", "on-secondary-fixed": "#00201d", "error": "#ba1a1a", "on-primary-fixed-variant": "#004d64", "primary-container": "#0d5c75", "surface-container-highest": "#dae2fd", "on-primary-container": "#93d3ef", "background": "#faf8ff", "secondary-fixed": "#9cf2e8", "on-tertiary-container": "#c7c5ff", "tertiary-fixed-dim": "#c3c0ff", "secondary-fixed-dim": "#80d5cb", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter-desktop": "1.5rem", "space-md": "0.75rem", "margin-tablet": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "gutter": "1rem", "margin-desktop": "2rem" }, fontFamily: { "label-lg": ["Inter"], "body-lg": ["Inter"], "number-lg": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "number-md": ["Inter"] }, fontSize: { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "number-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "number-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go Back" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface hover:text-primary transition-colors focus:outline-none" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md font-bold text-on-surface truncate">Sku Adjustment</h1></div><div class="flex items-center justify-end min-w-[44px] h-11" id="header-action-slot"></div></div></header><main class="flex flex-col flex-1 w-full bg-surface pt-14 pb-safe"><div class="flex flex-col w-full px-margin pb-32">
<div class="mt-space-md bg-surface-container-low rounded-lg p-space-md flex items-center justify-between shadow-sm">
<div class="flex flex-col gap-space-xs min-w-0 pr-space-sm">
<span class="font-headline-sm text-headline-sm font-bold text-on-surface truncate">Polyester Yarn 30s</span>
<div class="flex items-center">
<span class="bg-secondary-fixed text-on-secondary-fixed-variant px-2 py-0.5 rounded-full font-label-sm text-label-sm inline-flex items-center gap-1 font-semibold">
<span class="material-symbols-outlined text-[13px]">inventory_2</span>
          Raw Material
        </span>
</div>
</div>
<div class="flex flex-col items-end shrink-0 pl-space-sm">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline font-semibold">Current Stock</span>
<span class="font-number-md text-number-md font-bold text-secondary">500 kg</span>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<label class="font-label-md text-label-md font-semibold text-on-surface mb-1.5 flex items-center justify-between">
<span>Adjustment Type <span class="text-error">*</span></span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Physical stock count</span>
</label>
<div class="bg-surface-container-low p-1 rounded-lg flex items-center gap-1 shadow-inner">
<button class="bg-secondary text-on-secondary font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center shadow-sm flex items-center justify-center gap-1.5 transition-all" id="btn-increase" type="button">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
<span>Increase (+)</span>
</button>
<button class="text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center flex items-center justify-center gap-1.5 transition-all" id="btn-decrease" type="button">
<span class="material-symbols-outlined text-[18px]">remove_circle_outline</span>
<span>Decrease (−)</span>
</button>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<label class="font-label-md text-label-md font-semibold text-on-surface mb-1.5 flex items-center justify-between" for="quantity-input">
<span>Quantity to Adjust <span class="text-error">*</span></span>
<span class="font-body-sm text-body-sm text-secondary font-medium" id="quick-preset">+25 kg Selected</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" id="qty-mode-icon">add</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface font-number-lg text-number-lg pl-9 pr-14 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-all" id="quantity-input" placeholder="0" step="1" type="number" value="25"/>
<span class="absolute right-3 font-label-lg text-label-lg text-outline select-none uppercase">kg</span>
</div>
<div class="flex items-center gap-2 mt-2">
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-2.5 py-1 rounded-lg transition-colors" onclick="setQty(5)" type="button">+5</button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-2.5 py-1 rounded-lg transition-colors" onclick="setQty(10)" type="button">+10</button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-2.5 py-1 rounded-lg transition-colors font-semibold text-primary" onclick="setQty(25)" type="button">+25</button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-2.5 py-1 rounded-lg transition-colors" onclick="setQty(50)" type="button">+50</button>
<button class="bg-surface-container hover:bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm px-2.5 py-1 rounded-lg transition-colors" onclick="setQty(100)" type="button">+100</button>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<label class="font-label-md text-label-md font-semibold text-on-surface mb-2">
      Reason for Adjustment <span class="text-error">*</span>
</label>
<div class="flex flex-wrap gap-2" id="reason-container">
<button class="reason-chip active bg-primary text-on-primary font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">verified</span>
<span>Recount / Correction</span>
</button>
<button class="reason-chip bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">broken_image</span>
<span>Damaged</span>
</button>
<button class="reason-chip bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">delete_sweep</span>
<span>Wastage</span>
</button>
<button class="reason-chip bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">search_off</span>
<span>Lost</span>
</button>
<button class="reason-chip bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all" type="button">
<span class="material-symbols-outlined text-[16px]">more_horiz</span>
<span>Other</span>
</button>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<label class="font-label-md text-label-md font-semibold text-on-surface mb-1.5">
      Adjustment Date <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute left-3 flex items-center pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md pl-10 pr-3 py-2.5 rounded-lg shadow-sm focus:outline-none cursor-pointer" readonly="" type="text" value="Today, 26 Oct 2023"/>
<div class="absolute right-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">expand_more</span>
</div>
</div>
</div>
<div class="mt-space-lg flex flex-col">
<label class="font-label-md text-label-md font-semibold text-on-surface mb-1.5 flex items-center justify-between" for="notes-input">
<span>Notes (Optional)</span>
<span class="font-body-sm text-body-sm text-outline">Floor audit note</span>
</label>
<textarea class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md px-3 py-2 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-all resize-none" id="notes-input" placeholder="Provide shelf, batch, or inspection context..." rows="2">Found 1 unopened bag in floor rack C2</textarea>
</div>
<div class="mt-space-xl bg-secondary-fixed/30 rounded-lg p-space-md shadow-sm flex items-start gap-3 transition-colors" id="preview-card">
<div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]" id="preview-icon">trending_up</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center gap-1.5 flex-wrap">
<span class="font-label-md text-label-md font-bold text-secondary" id="preview-text">Stock after adjustment: 500 kg → 525 kg</span>
</div>
<span class="font-body-sm text-body-sm text-on-secondary-fixed-variant mt-0.5" id="preview-subtext">+25 kg addition to inventory ledger</span>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-bright/95 backdrop-blur-md shadow-[0_-4px_16px_rgba(0,0,0,0.06)] px-margin py-3 pb-safe flex gap-space-md">
<button class="flex-1 bg-surface-container text-on-surface hover:bg-surface-container-high font-label-lg text-label-lg py-3 px-4 rounded-lg text-center transition-colors focus:outline-none" onclick="history.back()" type="button">
      Cancel
    </button>
<button class="flex-1 bg-primary text-on-primary hover:bg-primary-container font-label-lg text-label-lg py-3 px-4 rounded-lg text-center shadow-md transition-all flex items-center justify-center gap-1.5 focus:outline-none" id="btn-save" type="button">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span>Save Adjustment</span>
</button>
</div>
</div>
<script>
  let isIncrease = true;
  const baseStock = 500;
  const qtyInput = document.getElementById('quantity-input');
  const previewText = document.getElementById('preview-text');
  const previewSubtext = document.getElementById('preview-subtext');
  const previewIcon = document.getElementById('preview-icon');
  const previewCard = document.getElementById('preview-card');
  const qtyModeIcon = document.getElementById('qty-mode-icon');
  const quickPresetLabel = document.getElementById('quick-preset');

  const btnIncrease = document.getElementById('btn-increase');
  const btnDecrease = document.getElementById('btn-decrease');

  function updateCalculation() {
    const val = parseFloat(qtyInput.value) || 0;
    const finalStock = isIncrease ? (baseStock + val) : Math.max(0, baseStock - val);
    
    if (isIncrease) {
      previewText.textContent = `Stock after adjustment: ${baseStock} kg → ${finalStock} kg`;
      previewSubtext.textContent = `+${val} kg addition to inventory ledger`;
      previewCard.className = "mt-space-xl bg-secondary-fixed/30 rounded-lg p-space-md shadow-sm flex items-start gap-3 transition-colors";
      previewIcon.parentElement.className = "w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0 mt-0.5";
      previewIcon.textContent = "trending_up";
      qtyModeIcon.textContent = "add";
      quickPresetLabel.textContent = `+${val} kg Selected`;
      quickPresetLabel.className = "font-body-sm text-body-sm text-secondary font-medium";
    } else {
      previewText.textContent = `Stock after adjustment: ${baseStock} kg → ${finalStock} kg`;
      previewSubtext.textContent = `-${val} kg deduction from inventory ledger`;
      previewCard.className = "mt-space-xl bg-error-container/40 rounded-lg p-space-md shadow-sm flex items-start gap-3 transition-colors";
      previewIcon.parentElement.className = "w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center shrink-0 mt-0.5";
      previewIcon.textContent = "trending_down";
      qtyModeIcon.textContent = "remove";
      quickPresetLabel.textContent = `-${val} kg Selected`;
      quickPresetLabel.className = "font-body-sm text-body-sm text-error font-medium";
    }
  }

  function setQty(amount) {
    qtyInput.value = amount;
    updateCalculation();
  }

  btnIncrease.addEventListener('click', () => {
    isIncrease = true;
    btnIncrease.className = "bg-secondary text-on-secondary font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center shadow-sm flex items-center justify-center gap-1.5 transition-all";
    btnDecrease.className = "text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center flex items-center justify-center gap-1.5 transition-all";
    updateCalculation();
  });

  btnDecrease.addEventListener('click', () => {
    isIncrease = false;
    btnDecrease.className = "bg-error text-on-error font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center shadow-sm flex items-center justify-center gap-1.5 transition-all";
    btnIncrease.className = "text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg py-2 px-space-md rounded-lg flex-1 text-center flex items-center justify-center gap-1.5 transition-all";
    updateCalculation();
  });

  qtyInput.addEventListener('input', updateCalculation);

  const chips = document.querySelectorAll('.reason-chip');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => {
        c.className = "reason-chip bg-surface-container-lowest text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all";
      });
      chip.className = "reason-chip bg-primary text-on-primary font-label-md text-label-md px-3 py-2 rounded-lg shadow-sm flex items-center gap-1.5 transition-all";
    });
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const btn = document.getElementById('btn-save');
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px] animate-spin">refresh</span><span>Recorded</span>`;
    btn.classList.add('opacity-90');
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">done_all</span><span>Completed</span>`;
    }, 450);
  });
</script></main></body></html>
