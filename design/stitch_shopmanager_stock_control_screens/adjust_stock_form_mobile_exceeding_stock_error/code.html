<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#e2dfff", "surface-bright": "#faf8ff", "secondary-container": "#99efe5", "on-error": "#ffffff", "primary-fixed": "#bde9ff", "outline": "#70787d", "inverse-surface": "#283044", "on-tertiary": "#ffffff", "surface-container-low": "#f2f3ff", "on-secondary-container": "#006f67", "surface-container": "#eaedff", "error-container": "#ffdad6", "on-secondary-fixed-variant": "#00504a", "outline-variant": "#bfc8cd", "secondary": "#006a63", "surface-container-high": "#e2e7ff", "surface-tint": "#1e667f", "surface-variant": "#dae2fd", "tertiary-container": "#4a45b6", "on-surface": "#131b2e", "primary": "#004357", "on-secondary": "#ffffff", "inverse-on-surface": "#eef0ff", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#3b35a7", "surface-container-lowest": "#ffffff", "inverse-primary": "#90cfec", "on-primary-fixed": "#001f2a", "on-surface-variant": "#40484c", "tertiary": "#322a9e", "primary-fixed-dim": "#90cfec", "on-tertiary-fixed": "#0f0069", "on-background": "#131b2e", "surface": "#faf8ff", "surface-dim": "#d2d9f4", "on-secondary-fixed": "#00201d", "error": "#ba1a1a", "on-primary-fixed-variant": "#004d64", "primary-container": "#0d5c75", "surface-container-highest": "#dae2fd", "on-primary-container": "#93d3ef", "background": "#faf8ff", "secondary-fixed": "#9cf2e8", "on-tertiary-container": "#c7c5ff", "tertiary-fixed-dim": "#c3c0ff", "secondary-fixed-dim": "#80d5cb", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter-desktop": "1.5rem", "space-md": "0.75rem", "margin-tablet": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "gutter": "1rem", "margin-desktop": "2rem" }, fontFamily: { "label-lg": ["Inter"], "body-lg": ["Inter"], "number-lg": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "number-md": ["Inter"] }, fontSize: { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "number-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "number-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go Back" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface hover:text-primary transition-colors focus:outline-none" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md font-bold text-on-surface truncate">Sku Adjustment</h1></div><div class="flex items-center justify-end min-w-[44px] h-11" id="header-action-slot"></div></div></header><main class="flex flex-col flex-1 w-full bg-surface pt-14 pb-safe"><div class="flex flex-col w-full pb-28">
<div class="px-margin pt-space-md flex flex-col w-full">
<!-- 1. Item Read-Only Summary Chip -->
<div class="bg-surface-container p-3 mb-5 rounded-lg flex items-center justify-between shadow-sm">
<div class="flex flex-col sm:flex-row sm:items-center gap-1.5 min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface font-bold truncate">Polyester Yarn 30s</span>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm w-fit">
          Raw Material
        </span>
</div>
<div class="text-right shrink-0 ml-2">
<span class="font-label-md text-label-md text-secondary font-semibold">Current Stock: 500 kg</span>
</div>
</div>
<!-- 2. Adjustment Type (Required) - Segmented Control -->
<div class="flex flex-col mb-4">
<label class="font-label-md text-label-md text-on-surface font-semibold mb-1.5 flex items-center gap-1">
        Adjustment Type <span class="text-error">*</span>
</label>
<div class="bg-surface-container-high p-1 rounded-lg flex gap-1">
<button class="font-label-lg text-label-lg text-on-surface-variant font-medium py-2 px-4 rounded-lg flex-1 text-center transition-colors" type="button">
          Increase (+)
        </button>
<button class="bg-error text-on-error font-label-lg text-label-lg font-semibold py-2 px-4 rounded-lg flex-1 text-center shadow-sm flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[18px]">remove_circle</span>
          Decrease (−)
        </button>
</div>
</div>
<!-- 3. Quantity (Required) - Error State -->
<div class="flex flex-col mb-4">
<label class="font-label-md text-label-md text-error font-semibold mb-1.5 flex items-center gap-1">
        Quantity to Adjust <span class="text-error">*</span>
</label>
<div class="relative flex items-center">
<input aria-describedby="quantity-error-msg" aria-invalid="true" class="w-full bg-error-container text-on-error-container font-number-lg text-number-lg font-bold rounded-lg px-3 py-2.5 pr-14 focus:outline-none" type="number" value="550"/>
<span class="absolute right-3 font-label-lg text-label-lg text-on-error-container font-semibold pointer-events-none">
          kg
        </span>
</div>
<!-- Inline Error Message verbatim -->
<div class="font-label-sm text-label-sm text-error font-semibold mt-1.5 flex items-center gap-1.5" id="quantity-error-msg">
<span class="material-symbols-outlined text-[16px] text-error shrink-0">error</span>
<span>Only 500 kg in stock. An adjustment can't take stock below zero.</span>
</div>
</div>
<!-- Live Preview Card (Invalid Stock Warning) -->
<div class="bg-error-container text-on-error-container rounded-lg p-3.5 mb-5 shadow-sm">
<div class="flex items-center gap-1.5 font-headline-sm text-headline-sm font-bold text-error">
<span class="material-symbols-outlined text-[20px] text-error shrink-0">warning</span>
<span>Stock after adjustment: 500 kg → −50 kg (Invalid)</span>
</div>
<p class="font-body-sm text-body-sm text-on-error-container font-medium mt-1">
        Adjustments cannot reduce inventory below 0 kg.
      </p>
</div>
<!-- 4. Reason (Required) -->
<div class="flex flex-col mb-4">
<label class="font-label-md text-label-md text-on-surface font-semibold mb-2 flex items-center gap-1">
        Reason for Adjustment <span class="text-error">*</span>
</label>
<div class="flex flex-wrap gap-2">
<button class="bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md font-medium px-3 py-2 rounded-lg shadow-sm hover:bg-surface-container" type="button">
          Recount / Correction
        </button>
<button class="bg-primary text-on-primary font-label-md text-label-md font-semibold px-3 py-2 rounded-lg shadow-sm flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">check</span>
          Damaged
        </button>
<button class="bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md font-medium px-3 py-2 rounded-lg shadow-sm hover:bg-surface-container" type="button">
          Wastage
        </button>
<button class="bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md font-medium px-3 py-2 rounded-lg shadow-sm hover:bg-surface-container" type="button">
          Lost
        </button>
<button class="bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md font-medium px-3 py-2 rounded-lg shadow-sm hover:bg-surface-container" type="button">
          Other
        </button>
</div>
</div>
<!-- 5. Date -->
<div class="flex flex-col mb-4">
<label class="font-label-md text-label-md text-on-surface font-semibold mb-1.5">
        Date
      </label>
<div class="bg-surface-container-lowest text-on-surface rounded-lg px-3 py-2.5 flex items-center justify-between shadow-sm">
<span class="font-body-md text-body-md text-on-surface">Today, 26 Oct 2023</span>
<span class="material-symbols-outlined text-[20px] text-outline">calendar_today</span>
</div>
</div>
<!-- 6. Notes -->
<div class="flex flex-col mb-4">
<label class="font-label-md text-label-md text-on-surface font-semibold mb-1.5">
        Notes
      </label>
<textarea class="bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg px-3 py-2 shadow-sm focus:outline-none resize-none" rows="2">Water leakage from ceiling during weekend storm destroyed sacks</textarea>
</div>
</div>
<!-- Bottom Action Bar (Fixed at Base) -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-md pb-safe">
<div class="p-4 flex gap-3 max-w-md mx-auto w-full shadow-[0_-4px_12px_rgba(0,0,0,0.06)] bg-surface">
<button class="bg-surface-container-highest text-on-surface font-label-lg text-label-lg font-medium py-2.5 px-4 rounded-lg flex-1 text-center shadow-sm active:bg-surface-container-high transition-colors" onclick="history.back()" type="button">
        Cancel
      </button>
<button aria-disabled="true" class="bg-outline-variant text-on-surface-variant/60 cursor-not-allowed font-label-lg text-label-lg font-semibold py-2.5 px-4 rounded-lg flex-1 text-center shadow-none select-none flex items-center justify-center gap-1.5" disabled="" type="button">
<span class="material-symbols-outlined text-[18px]">lock</span>
        Save Adjustment
      </button>
</div>
</div>
</div></main></body></html>
