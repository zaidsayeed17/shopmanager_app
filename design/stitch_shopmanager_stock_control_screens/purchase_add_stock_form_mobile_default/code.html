<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-fixed": "#e2dfff", "surface-bright": "#faf8ff", "secondary-container": "#99efe5", "on-error": "#ffffff", "primary-fixed": "#bde9ff", "outline": "#70787d", "inverse-surface": "#283044", "on-tertiary": "#ffffff", "surface-container-low": "#f2f3ff", "on-secondary-container": "#006f67", "surface-container": "#eaedff", "error-container": "#ffdad6", "on-secondary-fixed-variant": "#00504a", "outline-variant": "#bfc8cd", "secondary": "#006a63", "surface-container-high": "#e2e7ff", "surface-tint": "#1e667f", "surface-variant": "#dae2fd", "tertiary-container": "#4a45b6", "on-surface": "#131b2e", "primary": "#004357", "on-secondary": "#ffffff", "inverse-on-surface": "#eef0ff", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#3b35a7", "surface-container-lowest": "#ffffff", "inverse-primary": "#90cfec", "on-primary-fixed": "#001f2a", "on-surface-variant": "#40484c", "tertiary": "#322a9e", "primary-fixed-dim": "#90cfec", "on-tertiary-fixed": "#0f0069", "on-background": "#131b2e", "surface": "#faf8ff", "surface-dim": "#d2d9f4", "on-secondary-fixed": "#00201d", "error": "#ba1a1a", "on-primary-fixed-variant": "#004d64", "primary-container": "#0d5c75", "surface-container-highest": "#dae2fd", "on-primary-container": "#93d3ef", "background": "#faf8ff", "secondary-fixed": "#9cf2e8", "on-tertiary-container": "#c7c5ff", "tertiary-fixed-dim": "#c3c0ff", "secondary-fixed-dim": "#80d5cb", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: { "space-xs": "0.25rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter-desktop": "1.5rem", "space-md": "0.75rem", "margin-tablet": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "gutter": "1rem", "margin-desktop": "2rem" }, fontFamily: { "label-lg": ["Inter"], "body-lg": ["Inter"], "number-lg": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "number-md": ["Inter"] }, fontSize: { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "number-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "number-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go Back" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface hover:text-primary transition-colors focus:outline-none" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md font-bold text-on-surface truncate">Material Receipt</h1></div><div class="flex items-center justify-end min-w-[44px] h-11" id="header-action-slot"></div></div></header><main class="flex flex-col flex-1 w-full bg-surface pt-14 pb-safe"><div class="flex flex-col w-full pb-24">
<div class="px-margin pt-space-md flex flex-col">
<!-- 1. Item Read-Only Summary Chip -->
<div class="bg-surface-container-low rounded-lg p-space-md mb-space-lg flex items-center justify-between shadow-sm">
<div class="flex flex-col min-w-0 pr-space-sm">
<div class="flex items-center gap-space-xs flex-wrap">
<span class="font-headline-sm text-headline-sm font-bold text-on-surface truncate">Polyester Yarn 30s</span>
<span class="bg-secondary-container/60 text-on-secondary-container px-2 py-0.5 rounded-full font-label-sm text-label-sm uppercase tracking-wide">Raw Material</span>
</div>
</div>
<div class="text-right shrink-0">
<span class="font-label-sm text-label-sm font-semibold text-secondary block">Current Stock: 500 kg</span>
</div>
</div>
<!-- Form Fields Form Container -->
<form class="flex flex-col gap-space-lg" id="purchaseForm" onsubmit="event.preventDefault();">
<!-- 2. Quantity Purchased (Required) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1.5 flex items-center justify-between" for="qtyInput">
<span>Quantity Purchased <span class="text-error">*</span></span>
<span class="font-body-sm text-body-sm text-outline font-normal">Base unit</span>
</label>
<div class="flex items-stretch rounded-lg overflow-hidden bg-surface-container-lowest shadow-sm focus-within:ring-2 focus-within:ring-primary-container">
<input class="flex-1 w-full bg-transparent px-3 py-2.5 font-headline-sm text-headline-sm font-semibold text-on-surface focus:outline-none" id="qtyInput" min="0" placeholder="0" required="" step="any" type="number" value="200"/>
<div class="bg-surface-container px-space-md flex items-center justify-center font-label-lg text-label-lg text-on-surface-variant font-medium select-none">
            kg
          </div>
</div>
</div>
<!-- 3. Purchase Rate per unit (Required) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1.5" for="rateInput">
          Purchase Rate per unit (₹) <span class="text-error">*</span>
</label>
<div class="flex items-stretch rounded-lg overflow-hidden bg-surface-container-lowest shadow-sm focus-within:ring-2 focus-within:ring-primary-container">
<div class="bg-surface-container px-3 flex items-center justify-center font-label-lg text-label-lg text-on-surface-variant font-semibold select-none">
            ₹
          </div>
<input class="flex-1 w-full bg-transparent px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none" id="rateInput" min="0" placeholder="0.00" required="" step="0.01" type="number" value="180.00"/>
</div>
<!-- Checkbox beneath -->
<label class="flex items-center gap-space-sm mt-space-sm cursor-pointer select-none group">
<input checked="" class="w-4 h-4 rounded-lg accent-primary-container cursor-pointer transition-colors" id="updateRateCheck" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface">
            Update this item's saved purchase rate
          </span>
</label>
</div>
<!-- 4. Date (Required) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1.5" for="dateInput">
          Purchase Date <span class="text-error">*</span>
</label>
<div class="relative flex items-center rounded-lg bg-surface-container-lowest shadow-sm focus-within:ring-2 focus-within:ring-primary-container">
<input class="w-full bg-transparent pl-3 pr-10 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none" id="dateInput" required="" type="text" value="Today, 26 Oct 2023"/>
<span class="material-symbols-outlined text-outline absolute right-3 pointer-events-none text-[20px]">
            calendar_today
          </span>
</div>
</div>
<!-- 5. Supplier (Optional) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1.5" for="supplierInput">
          Supplier (Optional)
        </label>
<div class="flex items-center rounded-lg bg-surface-container-lowest shadow-sm focus-within:ring-2 focus-within:ring-primary-container">
<input class="w-full bg-transparent px-3 py-2.5 font-body-md text-body-md text-on-surface focus:outline-none" id="supplierInput" placeholder="Enter supplier or vendor name" type="text" value="Vardhman Textiles Ltd"/>
</div>
</div>
<!-- 6. Notes (Optional) -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-1.5" for="notesInput">
          Notes (Optional)
        </label>
<div class="rounded-lg bg-surface-container-lowest shadow-sm focus-within:ring-2 focus-within:ring-primary-container overflow-hidden">
<textarea class="w-full bg-transparent px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none resize-none placeholder:text-outline" id="notesInput" placeholder="e.g. Invoice #PO-9921, batch lot 12" rows="3"></textarea>
</div>
</div>
<!-- LIVE PREVIEW CARD -->
<div class="bg-secondary-fixed/30 rounded-lg p-3.5 my-space-sm flex flex-col gap-1 transition-all duration-200">
<div class="flex items-center justify-between text-secondary">
<span class="font-label-md text-label-md font-bold tracking-tight">Stock after purchase:</span>
<span class="font-headline-sm text-headline-sm font-bold" id="stockCalcDisplay">500 kg → 700 kg</span>
</div>
<div class="flex items-center justify-between text-on-secondary-container">
<span class="font-body-sm text-body-sm font-medium">Purchase amount:</span>
<span class="font-label-md text-label-md font-semibold" id="amountCalcDisplay">₹36,000</span>
</div>
</div>
</form>
</div>
<!-- FIXED BOTTOM ACTIONS BAR -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md px-margin py-3 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="max-w-md mx-auto flex items-center gap-space-md">
<button class="flex-1 py-2.5 px-4 rounded-lg bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-container active:scale-[0.98] transition-all text-center focus:outline-none" onclick="history.back()" type="button">
        Cancel
      </button>
<button class="flex-1 py-2.5 px-4 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md font-semibold shadow hover:opacity-95 active:scale-[0.98] transition-all text-center flex items-center justify-center gap-1.5 focus:outline-none" id="saveBtn" onclick="handleSave()" type="button">
<span>Save Purchase</span>
</button>
</div>
</div>
</div>
<script>
  (function initCalculator() {
    const qtyInput = document.getElementById('qtyInput');
    const rateInput = document.getElementById('rateInput');
    const stockCalcDisplay = document.getElementById('stockCalcDisplay');
    const amountCalcDisplay = document.getElementById('amountCalcDisplay');
    const baseStock = 500;

    function recalculate() {
      const qty = parseFloat(qtyInput.value) || 0;
      const rate = parseFloat(rateInput.value) || 0;
      
      const newStock = baseStock + qty;
      const totalAmount = qty * rate;

      stockCalcDisplay.textContent = baseStock + ' kg → ' + newStock.toLocaleString() + ' kg';
      amountCalcDisplay.textContent = '₹' + totalAmount.toLocaleString(undefined, {
        minimumFractionDigits: totalAmount % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    qtyInput.addEventListener('input', recalculate);
    rateInput.addEventListener('input', recalculate);
  })();

  function handleSave() {
    const saveBtn = document.getElementById('saveBtn');
    const originalText = saveBtn.innerHTML;
    saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span><span>Saving...</span>';
    saveBtn.disabled = true;
    setTimeout(() => {
      saveBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>Saved</span>';
      setTimeout(() => {
        history.back();
      }, 400);
    }, 600);
  }
</script></main></body></html>
