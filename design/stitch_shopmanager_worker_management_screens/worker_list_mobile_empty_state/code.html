", "on-secondary-fixed": "#00201d", "surface": "#faf8ff", "on-secondary-container": "#006f67" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "space-lg": "1.25rem", "space-md": "0.75rem", "space-xl": "1.75rem", "margin": "1.5rem", "gutter-mobile": "0.75rem", "gutter": "1rem", "space-xs": "0.25rem", "margin-mobile": "1rem" }, "fontFamily": { "tabular-data": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "tabular-data": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] -ml-space-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Workers</h1></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin-mobile pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-space-lg">
<div class="flex flex-col gap-space-md pt-space-xs">
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">search</span>
</div>
<input aria-label="Search by name or mobile number" class="w-full h-9 pl-9 pr-3 rounded bg-surface-container-low text-on-surface-variant placeholder:text-outline font-body-md text-body-md opacity-75 cursor-not-allowed select-none" disabled="" placeholder="Search by name or mobile number" type="text"/>
</div>
<div class="flex items-center gap-space-xs overflow-x-auto pb-1 no-scrollbar">
<button class="h-[26px] px-2.5 rounded-full bg-primary-container text-on-primary font-label-sm text-label-sm inline-flex items-center justify-center whitespace-nowrap shadow-sm" type="button">
        All (0)
      </button>
<button class="h-[26px] px-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm inline-flex items-center justify-center whitespace-nowrap" type="button">
        Active (0)
      </button>
<button class="h-[26px] px-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm inline-flex items-center justify-center whitespace-nowrap" type="button">
        Inactive (0)
      </button>
</div>
</div>
<div class="w-full my-auto py-12 flex flex-col items-center justify-center text-center px-space-md">
<div class="relative mb-space-lg flex items-center justify-center">
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center relative">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[36px] text-outline" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
            badge
          </span>
</div>
<div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-[16px]">
            engineering
          </span>
</div>
</div>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-space-xs font-semibold">
      No workers yet
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mb-space-xl">
      Add the workers who process your raw material
    </p>
<button class="inline-flex items-center justify-center gap-space-xs bg-primary-container hover:bg-primary active:scale-[0.98] text-on-primary py-3 px-6 rounded font-label-md text-label-md transition-all shadow-sm" id="add-worker-trigger" type="button">
<span class="material-symbols-outlined text-[18px]">person_add</span>
<span>+ Add Your First Worker</span>
</button>
</div>
<div class="w-full bg-surface-container-lowest p-space-md rounded shadow-sm mt-auto flex items-start gap-space-md">
<div class="w-8 h-8 rounded bg-surface-container flex items-center justify-center text-primary-container shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[18px]">lightbulb</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-md text-label-md text-on-surface">Floor Tip</span>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
        Assign daily batch logs, manage output pieces, and track wage disbursement directly under individual worker profiles.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const trigger = document.getElementById('add-worker-trigger');
    if (trigger) {
      trigger.addEventListener('click', function() {
        this.classList.add('opacity-90');
        setTimeout(() => this.classList.remove('opacity-90'), 150);
      });
    }
  })();
</script></main></body></html>
