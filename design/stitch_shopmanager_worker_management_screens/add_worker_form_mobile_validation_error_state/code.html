<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dae2fd", "on-tertiary": "#ffffff", "surface-container-highest": "#dae2fd", "error-container": "#ffdad6", "secondary-fixed-dim": "#80d5cb", "on-tertiary-fixed-variant": "#763300", "surface-container": "#eaedff", "on-primary-fixed-variant": "#004d64", "surface-bright": "#faf8ff", "on-surface-variant": "#40484c", "inverse-surface": "#283044", "outline": "#70787d", "on-tertiary-container": "#ffbb97", "secondary-container": "#99efe5", "on-secondary": "#ffffff", "primary-fixed": "#bde9ff", "on-surface": "#131b2e", "primary": "#004357", "on-background": "#131b2e", "on-error": "#ffffff", "on-secondary-fixed-variant": "#00504a", "outline-variant": "#bfc8cd", "tertiary-container": "#8d3e00", "primary-container": "#0d5c75", "on-tertiary-fixed": "#331200", "surface-container-high": "#e2e7ff", "secondary-fixed": "#9cf2e8", "error": "#ba1a1a", "tertiary": "#692c00", "surface-tint": "#1e667f", "surface-container-low": "#f2f3ff", "on-primary-container": "#93d3ef", "on-primary-fixed": "#001f2a", "background": "#faf8ff", "inverse-primary": "#90cfec", "tertiary-fixed": "#ffdbca", "tertiary-fixed-dim": "#ffb68e", "surface-container-lowest": "#ffffff", "on-error-container": "#93000a", "on-primary": "#ffffff", "inverse-on-surface": "#eef0ff", "primary-fixed-dim": "#90cfec", "secondary": "#006a63", "surface-dim": "#d2d9f4", "on-secondary-fixed": "#00201d", "surface": "#faf8ff", "on-secondary-container": "#006f67" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "space-lg": "1.25rem", "space-md": "0.75rem", "space-xl": "1.75rem", "margin": "1.5rem", "gutter-mobile": "0.75rem", "gutter": "1rem", "space-xs": "0.25rem", "margin-mobile": "1rem" }, "fontFamily": { "tabular-data": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "tabular-data": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] -ml-space-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Worker Details</h1></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin-mobile pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-28">
<!-- Error Summary Banner -->
<div class="w-full bg-[#FEE2E2] border border-[#FCA5A5] rounded-[4px] p-space-md mb-space-lg flex items-start gap-space-sm shadow-sm" role="alert">
<span class="material-symbols-outlined text-[#B91C1C] text-[20px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-[#B91C1C] font-bold">2 details need attention</span>
<span class="font-body-sm text-body-sm text-[#B91C1C] opacity-90 mt-0.5">Please correct the highlighted fields before registering the operative.</span>
</div>
</div>
<!-- Main Utilitarian Form Card -->
<form class="flex flex-col gap-space-lg w-full bg-surface-container-lowest p-space-lg rounded-[4px] shadow-sm" id="workerForm" onsubmit="event.preventDefault();">
<!-- Field 1: Worker Name (Error State) -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="workerName">
          Worker Name <span class="text-[#B91C1C]">*</span>
</label>
<span class="font-label-sm text-label-sm text-[#B91C1C] font-semibold uppercase tracking-wider">Required</span>
</div>
<div class="relative flex items-center">
<input aria-describedby="workerNameError" aria-invalid="true" class="w-full h-10 px-3 pr-10 bg-surface-container-lowest rounded-[4px] font-body-md text-body-md text-on-surface placeholder:text-outline/60 border-[1.5px] border-[#B91C1C] focus:outline-none focus:ring-1 focus:ring-[#B91C1C] transition-colors" id="workerName" name="workerName" placeholder="e.g. Rajesh Kumar" type="text"/>
<span class="material-symbols-outlined absolute right-3 text-[#B91C1C] text-[20px] pointer-events-none" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<p class="font-body-sm text-body-sm text-[#B91C1C] flex items-center gap-1 mt-0.5" id="workerNameError">
<span>Worker name is required</span>
</p>
</div>
<!-- Field 2: Mobile Number (Error State) -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="workerPhone">
        Mobile Number
      </label>
<div class="relative flex items-center">
<input aria-describedby="workerPhoneError" aria-invalid="true" class="w-full h-10 px-3 pr-10 bg-surface-container-lowest rounded-[4px] font-tabular-data text-tabular-data text-on-surface border-[1.5px] border-[#B91C1C] focus:outline-none focus:ring-1 focus:ring-[#B91C1C] transition-colors" id="workerPhone" name="workerPhone" type="tel" value="+91 98765"/>
<span class="material-symbols-outlined absolute right-3 text-[#B91C1C] text-[20px] pointer-events-none" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<p class="font-body-sm text-body-sm text-[#B91C1C] flex items-center gap-1 mt-0.5" id="workerPhoneError">
<span>Enter a valid 10-digit mobile number</span>
</p>
</div>
<!-- Field 3: Work Type (Interactive Chips) -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface">
        Work Type
      </label>
<div class="relative flex items-center">
<input class="w-full h-10 px-3 bg-surface-container-lowest rounded-[4px] font-body-md text-body-md text-on-surface border border-outline-variant focus:border-primary-container focus:outline-none" id="workTypeInput" name="workType" placeholder="Select or specify trade" type="text" value="Stitching"/>
</div>
<!-- Quick Chips -->
<div class="flex flex-wrap gap-1.5 mt-1.5" id="chipContainer">
<button class="work-chip px-3 py-1 bg-primary text-on-primary rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all" onclick="selectChip(this, 'Stitching')" type="button">
          Stitching
        </button>
<button class="work-chip px-3 py-1 bg-surface-container-high text-on-surface-variant hover:text-on-surface rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all" onclick="selectChip(this, 'Cutting')" type="button">
          Cutting
        </button>
<button class="work-chip px-3 py-1 bg-surface-container-high text-on-surface-variant hover:text-on-surface rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all" onclick="selectChip(this, 'Finishing')" type="button">
          Finishing
        </button>
<button class="work-chip px-3 py-1 bg-surface-container-high text-on-surface-variant hover:text-on-surface rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all" onclick="selectChip(this, 'Packing')" type="button">
          Packing
        </button>
</div>
</div>
<!-- Field 4: Address -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="workerAddress">
        Address
      </label>
<textarea class="w-full p-3 bg-surface-container-lowest rounded-[4px] font-body-md text-body-md text-on-surface placeholder:text-outline/60 border border-outline-variant focus:border-primary-container focus:outline-none resize-none" id="workerAddress" name="workerAddress" placeholder="Floor, building, street, unit number" rows="2"></textarea>
</div>
<!-- Field 5: Notes -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="workerNotes">
        Notes
      </label>
<textarea class="w-full p-3 bg-surface-container-lowest rounded-[4px] font-body-md text-body-md text-on-surface placeholder:text-outline/60 border border-outline-variant focus:border-primary-container focus:outline-none resize-none" id="workerNotes" name="workerNotes" placeholder="Emergency contact, shift constraints, or machinery certs" rows="2"></textarea>
</div>
<!-- Active Switch is HIDDEN as mandated -->
<input name="isActive" type="hidden" value="true"/>
</form>
<!-- Pinned Bottom Bar -->
<div class="fixed bottom-0 inset-x-0 bg-surface/95 backdrop-blur-md pb-safe border-t border-surface-container-high z-40">
<div class="max-w-md mx-auto px-margin-mobile py-space-sm flex items-center justify-end gap-space-md">
<button class="h-10 px-space-lg rounded-[4px] font-label-md text-label-md text-on-surface bg-surface-container-lowest border border-outline-variant hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()" type="button">
        Cancel
      </button>
<button class="h-10 px-space-lg rounded-[4px] font-label-md text-label-md text-on-primary bg-[#0D5C75] hover:bg-[#0A485C] active:scale-95 shadow-sm transition-all flex items-center gap-1.5" form="workerForm" type="submit">
<span class="material-symbols-outlined text-[18px]">check</span>
        Save Worker
      </button>
</div>
</div>
</div>
<script>
  function selectChip(button, tradeValue) {
    const input = document.getElementById('workTypeInput');
    if (input) {
      input.value = tradeValue;
    }
    const chips = document.querySelectorAll('.work-chip');
    chips.forEach(chip => {
      chip.className = 'work-chip px-3 py-1 bg-surface-container-high text-on-surface-variant hover:text-on-surface rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all';
    });
    button.className = 'work-chip px-3 py-1 bg-primary text-on-primary rounded-[4px] font-label-sm text-label-sm active:scale-95 transition-all';
  }
</script></main></body></html>
