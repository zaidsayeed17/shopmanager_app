<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#dae2fd", "on-tertiary": "#ffffff", "surface-container-highest": "#dae2fd", "error-container": "#ffdad6", "secondary-fixed-dim": "#80d5cb", "on-tertiary-fixed-variant": "#763300", "surface-container": "#eaedff", "on-primary-fixed-variant": "#004d64", "surface-bright": "#faf8ff", "on-surface-variant": "#40484c", "inverse-surface": "#283044", "outline": "#70787d", "on-tertiary-container": "#ffbb97", "secondary-container": "#99efe5", "on-secondary": "#ffffff", "primary-fixed": "#bde9ff", "on-surface": "#131b2e", "primary": "#004357", "on-background": "#131b2e", "on-error": "#ffffff", "on-secondary-fixed-variant": "#00504a", "outline-variant": "#bfc8cd", "tertiary-container": "#8d3e00", "primary-container": "#0d5c75", "on-tertiary-fixed": "#331200", "surface-container-high": "#e2e7ff", "secondary-fixed": "#9cf2e8", "error": "#ba1a1a", "tertiary": "#692c00", "surface-tint": "#1e667f", "surface-container-low": "#f2f3ff", "on-primary-container": "#93d3ef", "on-primary-fixed": "#001f2a", "background": "#faf8ff", "inverse-primary": "#90cfec", "tertiary-fixed": "#ffdbca", "tertiary-fixed-dim": "#ffb68e", "surface-container-lowest": "#ffffff", "on-error-container": "#93000a", "on-primary": "#ffffff", "inverse-on-surface": "#eef0ff", "primary-fixed-dim": "#90cfec", "secondary": "#006a63", "surface-dim": "#d2d9f4", "on-secondary-fixed": "#00201d", "surface": "#faf8ff", "on-secondary-container": "#006f67" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "space-lg": "1.25rem", "space-md": "0.75rem", "space-xl": "1.75rem", "margin": "1.5rem", "gutter-mobile": "0.75rem", "gutter": "1rem", "space-xs": "0.25rem", "margin-mobile": "1rem" }, "fontFamily": { "tabular-data": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "body-sm": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "tabular-data": ["13px", { "lineHeight": "18px", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "18px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] -ml-space-sm flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Worker Details</h1></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin-mobile pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-28">
<div class="flex items-center gap-space-md py-space-sm mb-space-md bg-surface-container-low px-space-md rounded-lg shadow-sm">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">person_add</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface">New Personnel Profile</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Configure operator identity &amp; floor specialty</span>
</div>
</div>
<form class="flex flex-col gap-space-lg w-full" id="add-worker-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1" for="worker-name">
<span>Worker Name</span>
<span class="text-error font-bold text-[14px] leading-none">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors" id="worker-name" name="workerName" placeholder="e.g. Ramesh Kumar" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="mobile-number">
<span>Mobile Number</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Optional</span>
</label>
<div class="flex h-11 rounded-lg shadow-sm overflow-hidden bg-surface-container-lowest focus-within:bg-surface-container-low transition-colors">
<span class="inline-flex items-center px-3.5 bg-surface-container font-label-md text-label-md text-on-surface select-none">
          +91
        </span>
<input class="flex-1 px-3 bg-transparent text-on-surface font-tabular-data text-tabular-data placeholder:text-outline focus:outline-none" id="mobile-number" inputmode="numeric" maxlength="10" name="mobileNumber" pattern="[0-9]{10}" placeholder="10-digit number" type="tel"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
        Optional. Used to call or message the worker
      </p>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="work-type">
<span>Work Type</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Optional</span>
</label>
<input class="w-full h-11 px-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors" id="work-type" name="workType" placeholder="e.g. Stitching, Cutting" type="text"/>
<div class="flex flex-wrap items-center gap-space-xs pt-1">
<button class="work-tag px-3 py-1.5 rounded-full font-label-sm text-label-sm bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors active:scale-95 text-left" onclick="selectWorkType('Stitching')" type="button">
          + Stitching
        </button>
<button class="work-tag px-3 py-1.5 rounded-full font-label-sm text-label-sm bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors active:scale-95 text-left" onclick="selectWorkType('Cutting')" type="button">
          + Cutting
        </button>
<button class="work-tag px-3 py-1.5 rounded-full font-label-sm text-label-sm bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors active:scale-95 text-left" onclick="selectWorkType('Finishing')" type="button">
          + Finishing
        </button>
<button class="work-tag px-3 py-1.5 rounded-full font-label-sm text-label-sm bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors active:scale-95 text-left" onclick="selectWorkType('Packing')" type="button">
          + Packing
        </button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="address">
<span>Address</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Optional</span>
</label>
<textarea class="w-full p-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors resize-none" id="address" name="address" placeholder="Enter shop or residential address" rows="3"></textarea>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="notes">
<span>Notes</span>
<span class="font-body-sm text-body-sm text-on-surface-variant font-normal">Optional</span>
</label>
<textarea class="w-full p-3 bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-low transition-colors resize-none" id="notes" name="notes" placeholder="Any additional notes (e.g. timing preferences, machine used)" rows="2"></textarea>
</div>
</form>
<div class="fixed bottom-0 inset-x-0 bg-surface-container-lowest shadow-xl px-margin-mobile py-space-md z-40 pb-safe">
<div class="flex items-center gap-space-md max-w-md mx-auto">
<button class="flex-1 h-11 px-4 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-md text-label-md transition-colors active:scale-[0.99] flex items-center justify-center" onclick="history.back()" type="button">
        Cancel
      </button>
<button class="flex-1 h-11 px-4 rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-colors active:scale-[0.99] flex items-center justify-center gap-1.5" onclick="submitWorkerForm()" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span>Save Worker</span>
</button>
</div>
</div>
</div>
<script>
  function selectWorkType(skill) {
    const input = document.getElementById('work-type');
    const currentValue = input.value.trim();
    if (!currentValue) {
      input.value = skill;
    } else {
      const items = currentValue.split(',').map(s => s.trim()).filter(Boolean);
      if (!items.includes(skill)) {
        items.push(skill);
        input.value = items.join(', ');
      }
    }
    input.focus();
  }

  function submitWorkerForm() {
    const nameInput = document.getElementById('worker-name');
    if (!nameInput.value.trim()) {
      nameInput.focus();
      nameInput.classList.add('bg-error-container');
      setTimeout(() => {
        nameInput.classList.remove('bg-error-container');
      }, 1500);
      return;
    }
    history.back();
  }
</script></main></body></html>
