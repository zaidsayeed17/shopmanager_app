<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Material - Empty State</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
  .btn-radius { border-radius: 4px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between max-w-md mx-auto border-x border-slate-200">

  <!-- Main Scrollable Area -->
  <div class="flex-1 pb-24">
    <!-- Top Simple Bar -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 sticky top-0 z-20">
      <button class="p-1.5 -ml-1 text-slate-700 hover:bg-slate-100 rounded focus:outline-none" aria-label="Go back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-lg font-semibold text-slate-900 tracking-tight">Issue Material</h1>
    </header>

    <main class="p-4 space-y-4">
      <!-- 1. Worker Summary Chip (Read-only) -->
      <section class="bg-white border border-slate-200 rounded p-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#0D5C75]/10 text-[#0D5C75] font-semibold text-sm flex items-center justify-center border border-[#0D5C75]/20">
            RK
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-semibold text-slate-900 text-sm">Ramesh Kumar</span>
              <span class="text-[11px] px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-600 border border-slate-200">ID: W-104</span>
            </div>
            <p class="text-xs text-slate-500 font-medium mt-0.5">Master Tailor &bull; Stitching Section A</p>
          </div>
        </div>
        <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider bg-slate-50 px-2 py-1 rounded border border-slate-200">Worker</span>
      </section>

      <!-- 2. Issue Date -->
      <section class="bg-white border border-slate-200 rounded p-3 shadow-xs">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Issue Date</label>
        <div class="relative flex items-center">
          <input type="text" readonly value="Today, 24 May 2024" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded px-3 py-2 pl-9 font-medium cursor-pointer focus:outline-none focus:ring-1 focus:ring-[#0D5C75]">
          <svg class="w-4 h-4 text-slate-500 absolute left-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
      </section>

      <!-- 3. Materials Section (Empty State) -->
      <section class="space-y-2">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold text-slate-800">Materials to Issue</h2>
          <span class="text-xs text-slate-400 font-medium">0 items</span>
        </div>

        <!-- Prominent Empty Callout Card -->
        <div class="bg-white border-2 border-dashed border-slate-300 rounded p-6 text-center">
          <div class="w-12 h-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-[#0D5C75] mb-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          </div>
          <h3 class="text-sm font-semibold text-slate-800 mb-1">No materials added yet</h3>
          <p class="text-xs text-slate-500 max-w-xs mx-auto mb-4">Add raw materials (fabric, rib, thread, elastic) to record physical handover to this worker.</p>
          <button class="inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-[#0D5C75] text-white text-sm font-medium rounded hover:bg-[#0b4b60] transition shadow-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            + Add Material
          </button>
        </div>
      </section>

      <!-- 4. Notes Section -->
      <section class="bg-white border border-slate-200 rounded p-3 shadow-xs">
        <label for="notes" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">
          Notes <span class="text-slate-400 font-normal lowercase">(optional)</span>
        </label>
        <textarea id="notes" rows="2" placeholder="e.g. For Summer Polo Batch #12, Lot 4..." class="w-full text-sm border border-slate-200 rounded p-2.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-[#0D5C75] resize-none"></textarea>
      </section>

      <!-- 5. Summary / Preview Card (Empty) -->
      <section class="bg-slate-100/80 border border-slate-200 rounded p-3 flex items-center justify-between text-xs text-slate-500 font-medium">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <span>Summary preview</span>
        </div>
        <span class="font-semibold text-slate-600">0 materials &bull; 0 units</span>
      </section>
    </main>
  </div>

  <!-- 6. Bottom Sticky Action Bar -->
  <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 p-3 flex items-center gap-3 z-30 shadow-lg">
    <button type="button" class="w-1/3 py-2.5 px-3 border border-slate-300 text-slate-700 font-medium text-sm rounded hover:bg-slate-50 transition text-center">
      Cancel
    </button>
    <button type="button" disabled class="w-2/3 py-2.5 px-3 bg-slate-200 text-slate-400 font-medium text-sm rounded cursor-not-allowed text-center flex items-center justify-center gap-2">
      <span>Save &amp; Issue</span>
    </button>
  </footer>

</body>
</html>
